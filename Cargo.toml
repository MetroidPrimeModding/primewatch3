[package]
name = "primewatch3"
version = "0.1.0"
edition = "2024"

[dependencies]
# system stuff
sysinfo = "0.39"
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
libc = "0.2"
bimap = "0.6.3"

# tooling
bstruct = { path = "bstruct" }
rhai = { version = "1.26.0", features = ["serde"] }

# gui stuff
egui = { version = "0.36", features = ["persistence"] }
egui-wgpu = { version = "0.36", features = ["winit"] }
egui-winit = "0.36"
rfd = "0.17"

# serialization
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }

# gppu
glam = "0.33"
pollster = "1.0"
wgpu = "30"
winit = "0.30"

# Windows-only: real Dolphin process attach (OpenProcess / VirtualQueryEx / ReadProcessMemory)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_Debug",
] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
